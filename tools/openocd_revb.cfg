# -------- HELPERS -----------------------------------#
# TCL Crash Course - https://openocd.org/doc/html/Tcl-Crash-Course.html
# CPU HELPER: https://openocd.org/doc/html/CPU-Configuration.html 
# TAP HELPER: https://openocd.org/doc/html/TAP-Declaration.html
# General Commands: https://openocd.org/doc/html/General-Commands.html
# FLASH Commands: https://openocd.org/doc/html/Flash-Commands.html
# EVENTS: /riscv-openocd/src/target/target.c
# Openocd Flash driver: riscv-openocd/contrib/loaders/flash/fespi/riscv_fespi.c
# ------------------------------------------------------#

# WORK IN PROGRESS script

# As shipped, the OTP memory at the boot location is preprogrammed to
# jump immediately to the end of the OTP memory, which contains the
# following code to jump to the beginning of the SPI-Flash at 0x2000 0000:

# fence 0,0
# li t0, 0x20000000
# jr t0

# ----------------------------------------------------#
# CONFIGURATION STAGE
# ----------------------------------------------------#

  adapter speed 4000

  adapter driver jlink
  transport select jtag

  set _CHIPNAME riscv
  jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x20000913

  set _TARGETNAME $_CHIPNAME.cpu
  target create $_TARGETNAME.0 riscv -chain-position $_TARGETNAME

  # jtag cget  $_TARGETNAME.0 -idcode 

  # set work area in RAM 0x8000_0000 with size 0x4000
  $_TARGETNAME.0 configure -work-area-phys 0x80000000 -work-area-size 0x4000 -work-area-backup 0

  # No virtual to mem conversion
  riscv set_enable_virt2phys off
  riscv set_enable_virtual off

# gdb-flash-erase-start
    # Before the GDB flash process tries to erase the flash (default is reset init)
$_TARGETNAME.0 configure -event gdb-flash-erase-start {
  puts [format "    GDB Flash Erase Start"]
}

# gdb-flash-erase-end
    # After the GDB flash process has finished erasing the flash
$_TARGETNAME.0 configure -event gdb-flash-erase-end {
  puts [format "    GDB Flash Erase End"]
}

# gdb-flash-write-start
    # Before GDB writes to the flash
$_TARGETNAME.0 configure -event gdb-flash-write-start {
  puts [format "    GDB Flash Write Start"]
}

# gdb-flash-write-end
    # After GDB writes to the flash (default is reset halt)
$_TARGETNAME.0 configure -event gdb-flash-write-end {
  puts [format "    GDB Flash Write "]
}

# set work area in RAM 0x8000_0000 with size 0x4000
$_TARGETNAME.0 configure -work-area-phys 0x80000000 -work-area-size 0x4000 -work-area-backup 0

# No virtual to mem conversion
riscv set_enable_virt2phys off
riscv set_enable_virtual off

# Flash probe dont work

# flash bank name driver base size chip_width bus_width target [driver_options]
flash bank spi0 fespi 0x20000000 0 0 0 riscv.cpu.0 0x10014000

# ----------------------------------------------------#
# RUN STAGE
# ----------------------------------------------------#
init 

# set JTAG command version 3 to be used
jlink jtag 3

halt 100

# To invoke from gdb -> monitor e31_ram_load <bin>
proc e31_ram_load { program } {
  puts [format " e31_ram_load proc invoked with bin $program"]

  load_image $program 0x80000000 bin
  verify_image $program 0x80000000 bin
}

# Flash details (NOR and XIP)
# Address range - 0x2000_0000 - 0x3fff_ffff  (max upto 512MiB)
# But hifive1-revb board has only 32Mbit
# Size 32Mbit, sector size 4k
# Flash Part Num: IS25WP032D

proc hifive1revb_rom_load { program } {
  puts [format " e31_rom_load proc invoked with bin $program"]

# sect sector size 4k
  set sector_size_in_bytes [expr 4096]
  puts [format " sector_size_in_bytes = $sector_size_in_bytes"]

# TCL command to get file size in bytes
  set file_len_in_bytes [file size $program]
  puts [format " file_len_in_bytes = $file_len_in_bytes"]

# Calculate number of sectors
  set sectors_to_erase [expr $file_len_in_bytes/$sector_size_in_bytes]
  puts [format " sectors_to_erase = $sectors_to_erase"]

# Erase sectors_to_erase count
# flash erase sector num first last
  flash erase_sector 0 0 $sectors_to_erase
  puts [format " erasing done"]

# flash write_bank num filename [offset - optionsal]
  flash write_bank 0 $program
  puts [format " write done"]

  flash verify_bank 0 $program 
  puts [format " verify done"]
}

halt

